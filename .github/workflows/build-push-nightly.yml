name: Docker Build and Push Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: arma3-server

jobs:
  nightly-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine latest image tag
        id: get_version
        shell: bash
        run: |
          set -euo pipefail

          TAGS="$(git tag -l 'image-*' || true)"
          if [ -z "${TAGS}" ]; then
            echo "No image-* tags found."
            exit 1
          fi

          LATEST_TAG="$(printf "%s\n" "${TAGS}" | sort -V | tail -n 1)"
          VERSION="${LATEST_TAG#image-}"

          echo "Latest tag: ${LATEST_TAG}"
          echo "Using version: ${VERSION}"

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout code at latest image tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: image-${{ steps.get_version.outputs.version }}

      - name: Set lowercase owner
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER=${OWNER}" >> "${GITHUB_ENV}"
          echo "Owner (lowercase): ${OWNER}"

      - name: Debug image coordinates
        shell: bash
        run: |
          set -euo pipefail
          echo "FULL_IMAGE=${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          echo "VERSION=${VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (nightly)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # If you ONLY want amd64, use: linux/amd64
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            IMAGE_VERSION=${{ env.VERSION }}
          # If you suspect the attestation/index is involved, disable these:
          provenance: false
          sbom: false

      - name: Install jq (for JSON parsing)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Cleanup GHCR untagged images (older than 24h)
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${OWNER:-${GITHUB_REPOSITORY_OWNER,,}}"
          PACKAGE="${IMAGE_NAME}"
          API_URL="https://api.github.com"

          echo "Cleaning untagged GHCR images for ${OWNER}/${PACKAGE} (older than 24h)..."

          VERSIONS="$(curl -sSf \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${API_URL}/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100")"

          echo "${VERSIONS}" | jq -r '
            .[] |
            select((.metadata.container.tags | length) == 0) |
            select((now - (.created_at | fromdateiso8601)) > 86400) |
            .id
          ' | while read -r VERSION_ID; do
              [ -z "${VERSION_ID}" ] && continue
              echo "Deleting untagged version ID: ${VERSION_ID}"
              curl -sSf -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "${API_URL}/users/${OWNER}/packages/container/${PACKAGE}/versions/${VERSION_ID}" \
                && echo "Deleted ${VERSION_ID}"
            done
