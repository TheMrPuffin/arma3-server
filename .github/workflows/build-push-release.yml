name: Docker Build and Push on release tag

on:
  push:
    tags:
      - "image-*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: arma3-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#image-}"
          echo "TAG=${TAG}"
          echo "VERSION=${VERSION}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Set lowercase owner
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER=${OWNER}" >> "${GITHUB_ENV}"
          echo "Owner (lowercase): ${OWNER}"

      - name: Debug image coordinates
        shell: bash
        run: |
          set -euo pipefail
          echo "FULL_IMAGE=${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          echo "VERSION=${VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (release tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            IMAGE_VERSION=${{ env.VERSION }}
          provenance: false
          sbom: false
